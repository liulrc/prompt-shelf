<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>截图编辑 · 词匣</title>
  <link rel="icon" href="../../prototype/mark.svg"><link rel="stylesheet" href="../../prototype/style.css"><link rel="stylesheet" href="editor.css">
  <script src="bridge.js" defer></script><script src="../../prototype/screens-zip.js" defer></script><script src="editor.js" defer></script>
</head>
<body>
  <main id="editor">
    <header class="editor-head">
      <img src="../../prototype/mark.svg" width="27" height="27" alt="">
      <h1>截图编辑</h1><span id="dimensions"></span>
      <label class="zoom-label" for="zoom">视图</label>
      <select id="zoom" aria-label="截图缩放" disabled>
        <option value="fit">适应窗口</option><option value="width">适应宽度</option>
        <option value="0.5">50%</option><option value="1">100%</option><option value="2">200%</option>
      </select>
    </header>
    <section id="stage" aria-label="截图画布" tabindex="0">
      <div id="layout">
        <div id="canvas" hidden>
          <img id="photo" alt="当前截图" draggable="false">
          <svg id="marks" aria-label="标注图层" preserveAspectRatio="none"></svg>
        </div>
      </div>
    </section>
    <footer class="edit-footer">
      <div id="toolbar" role="toolbar" aria-label="标注与输出">
        <div class="tools" role="group" aria-label="标注工具">
          <button type="button" data-tool="rect" aria-label="矩形" title="矩形" aria-pressed="true"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="14" rx="1.3"/></svg></button>
          <button type="button" data-tool="line" aria-label="直线" title="直线" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="m4 20 16-16"/></svg></button>
          <button type="button" data-tool="arrow" aria-label="箭头" title="箭头" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="m4 20 15-15m-9 0h9v9"/></svg></button>
          <button type="button" data-tool="text" aria-label="文字标注" title="文字标注" aria-pressed="false"><svg viewBox="0 0 24 24"><path d="M4 7V4h16v3M12 4v16m-4 0h8"/></svg></button>
        </div>
        <label class="color-label" title="标注颜色"><input type="color" id="color" aria-label="标注颜色" value="#e34a36"></label>
        <select id="size" aria-label="文字像素字号" title="文字字号（原图像素）" hidden>
          <option>16</option><option>24</option><option selected>32</option><option>48</option><option>64</option><option>96</option>
        </select>
        <button type="button" id="undo" class="tool-button" aria-label="撤销标注" title="撤销标注" disabled><svg viewBox="0 0 24 24"><path d="m8 5-5 5 5 5M3 10h10a6 6 0 0 1 1 12"/></svg></button>
        <div class="outputs">
          <button type="button" class="quiet" id="cancel">取消</button>
          <button type="button" class="quiet" id="pin">置顶</button>
          <select id="format" aria-label="另存格式" hidden><option value="png">整张 PNG</option><option value="zip">分屏 PNG · ZIP</option></select>
          <button type="button" class="quiet" id="save">另存为</button>
          <button type="button" class="primary-action" id="copy">复制并完成</button>
        </div>
      </div>
      <div class="status-line"><span id="status" role="status" aria-live="polite">正在打开截图…</span><span id="percent"></span></div>
    </footer>
    <form id="text-form" hidden aria-label="编辑文字标注">
      <label for="text-entry">文字标注</label>
      <textarea id="text-entry" rows="3" wrap="off" placeholder="输入文字，可换行"></textarea>
      <div><button type="button" class="quiet" id="text-cancel">取消</button><button type="submit" class="primary-action" id="text-apply">添加文字</button></div>
    </form>
  </main>
</body>
</html>
