<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>设置 · 词匣</title>
  <link rel="icon" href="../../prototype/mark.svg">
  <link rel="stylesheet" href="../../prototype/style.css"><link rel="stylesheet" href="settings.css">
  <script src="bridge.js" defer></script><script src="settings.js" defer></script><script src="ai-settings.js" defer></script>
</head>
<body class="ds-body">
  <main class="ds-settings">
    <header class="ds-header"><img alt="" width="34" height="34" src="../../prototype/mark.svg"><h1>词匣设置</h1><small aria-label="版本 1.3.0">1.3.0</small></header>
    <form id="ai-settings" autocomplete="off">
      <section aria-labelledby="ai-heading"><h2 id="ai-heading">AI 模型接口</h2>
        <p>连接支持 OpenAI 兼容协议的服务。优化时只发送本次输入的提示词。</p>
        <label class="ds-field" for="ai-base">接口地址</label>
        <input id="ai-base" type="url" spellcheck="false" placeholder="https://api.example.com/v1">
        <label class="ds-field" for="ai-key">API 密钥</label>
        <input id="ai-key" type="password" autocomplete="new-password" spellcheck="false" placeholder="需要认证时填写">
        <label id="ai-clear-row" class="ds-check" hidden><input type="checkbox" id="ai-clear">保存时清除已存密钥</label>
        <div class="ds-model-header"><strong>可用模型</strong><button type="button" class="btn" id="ai-fetch">拉取模型列表</button></div>
        <div class="ds-model-search"><input id="ai-model-query" aria-label="搜索或输入模型名" placeholder="搜索或手动输入模型名" spellcheck="false"><button type="button" class="btn" id="ai-add-model">添加</button></div>
        <div id="ai-model-list" aria-label="模型列表"></div>
        <p id="ai-model-count"></p>
        <div class="ds-ai-actions"><button id="ai-save" class="btn primary" type="submit">保存模型配置</button></div>
        <p id="ai-feedback" role="status" aria-live="polite"></p>
      </section>
    </form>
    <form id="settings">
      <section><h2>剪贴板记录</h2><label class="ds-switch"><span><strong>跨应用自动记录</strong><small>将复制的文本、图片和视频文件保存在本机历史中。</small></span><input id="monitoring" type="checkbox" role="switch"></label></section>
      <section><h2>外观</h2><label class="ds-switch"><span><strong id="tray-label">显示菜单栏图标</strong><small>隐藏图标后仍可使用全局快捷键。</small></span><input id="show-tray-icon" type="checkbox" role="switch"></label></section>
      <section><h2>全局快捷键</h2><p>按一次打开，再按一次收起。截图选区和滚动过程中，再按截图快捷键可取消。</p><div id="hotkeys"></div></section>
      <div class="ds-actions"><button class="btn" type="button" id="defaults">恢复默认快捷键</button><button class="btn primary" id="save" type="submit">保存设置</button></div>
      <p id="message" role="status" aria-live="polite"></p>
    </form>
    <button class="btn" type="button" id="quit">退出词匣</button>
  </main>
</body>
</html>
