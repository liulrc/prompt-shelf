<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>设置 · 词匣</title>
  <link rel="icon" href="../../prototype/mark.svg">
  <link rel="stylesheet" href="../../prototype/style.css"><link rel="stylesheet" href="settings.css">
  <script defer src="bridge.js"></script><script defer src="settings.js"></script><script defer src="ai-settings.js"></script><script defer src="updates.js"></script>
</head>
<body class="ds-body">
  <main class="ds-settings">
    <header class="ds-header"><img width="40" height="40" alt="" src="../../prototype/mark.svg"><h1>词匣设置</h1></header>
    <nav class="ds-tabs" role="tablist" aria-label="设置分类">
      <button id="tab-general" type="button" role="tab" aria-selected="true" aria-controls="pane-general">通用</button>
      <button id="tab-models" type="button" role="tab" aria-selected="false" tabindex="-1" aria-controls="pane-models">AI 模型</button>
      <button id="tab-updates" type="button" role="tab" aria-selected="false" tabindex="-1" aria-controls="pane-updates">软件更新</button>
    </nav>
    <div class="ds-content">
      <section id="pane-general" role="tabpanel" aria-labelledby="tab-general">
        <form id="settings">
          <h2>后台运行</h2>
          <div class="ds-group">
            <label class="ds-switch"><span><strong>自动记录剪贴板</strong><small>将跨应用复制的文字、图片和视频文件记录在本机。</small></span><input id="monitoring" type="checkbox" role="switch"></label>
            <label class="ds-switch"><span><strong id="tray-label">显示菜单栏图标</strong><small>可通过图标或全局快捷键唤出词匣。</small></span><input id="show-tray-icon" type="checkbox" role="switch"></label>
          </div>
          <div class="ds-title-row"><h2>全局快捷键</h2><button class="ds-link" type="button" id="defaults">恢复默认快捷键</button></div>
          <p>按一次打开，再按一次收起。截图选区和滚动过程中可用同一快捷键取消。</p><div id="hotkeys" class="ds-group"></div>
          <div class="ds-actions"><p id="message" role="status" aria-live="polite"></p><button class="btn primary" id="save" type="submit">保存设置</button></div>
        </form>
        <footer class="ds-footer"><button class="ds-link" type="button" id="quit">退出词匣</button></footer>
      </section>
      <section id="pane-models" role="tabpanel" aria-labelledby="tab-models" hidden>
        <form id="ai-settings" autocomplete="off">
          <h2>AI 模型接口</h2><p>连接兼容 OpenAI 协议的服务。优化时只发送本次输入的提示词。</p>
          <label class="ds-field" for="ai-base">接口地址</label><input id="ai-base" type="url" spellcheck="false" placeholder="https://api.example.com/v1">
          <label class="ds-field" for="ai-key">API 密钥</label><input id="ai-key" type="password" autocomplete="new-password" spellcheck="false" placeholder="需要认证时填写">
          <label id="ai-clear-row" class="ds-check" hidden><input type="checkbox" id="ai-clear">保存时清除已存密钥</label>
          <div class="ds-title-row"><h2>可用模型</h2><button class="btn" type="button" id="ai-fetch">拉取模型列表</button></div>
          <div class="ds-model-search"><input id="ai-model-query" aria-label="搜索或输入模型名" placeholder="搜索或手动输入模型名" spellcheck="false"><button class="btn" type="button" id="ai-add-model">添加</button></div>
          <div id="ai-model-list" aria-label="模型列表"></div><p id="ai-model-count"></p>
          <div class="ds-actions"><p id="ai-feedback" role="status" aria-live="polite"></p><button id="ai-save" class="btn primary" type="submit">保存模型配置</button></div>
        </form>
      </section>
      <section id="pane-updates" role="tabpanel" aria-labelledby="tab-updates" hidden>
        <h2>版本与更新</h2>
        <div class="ds-version">
          <div><h3 id="update-title">正在读取版本…</h3><p id="update-versions"></p></div>
          <button class="btn primary" type="button" id="update-action" disabled>检查更新</button>
        </div>
        <div id="update-progress-wrap" hidden><progress id="update-progress" max="100" aria-label="更新进度"></progress></div>
        <p id="update-status" role="status" aria-live="polite"></p>
        <button id="update-installer" class="ds-link" type="button" hidden>打开已校验的安装包</button>
        <p id="update-time"></p>
        <h2>自动更新</h2>
        <div class="ds-group"><label class="ds-switch"><span><strong>空闲时自动安装更新</strong><small>定期检查正式版，下载并校验安装包，待工作结束后安装并重启词匣。</small></span><input id="update-auto" type="checkbox" role="switch" disabled></label></div>
        <p class="ds-source">更新来源为词匣在 GitHub 发布的正式版。系统可能要求你确认安装。</p>
        <details id="update-notes" hidden><summary>版本说明</summary><pre></pre></details>
      </section>
    </div>
  </main>
</body>
</html>
